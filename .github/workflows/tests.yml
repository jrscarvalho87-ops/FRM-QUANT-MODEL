name: RFM Quant checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt "numpy>=2,<3" "pandas>=2,<3" "xgboost>=3,<4" "scikit-learn>=1.5,<2"
      - name: Compile Python sources
        run: python -m compileall -q app.py data_quality.py market_audit.py history.py universe.py execution.py structure.py fibonacci.py volume_profile.py rfm_candidates.py research_stats.py structural_liquidity.py fvg_state.py htf_context.py swing_geometry.py swing_liquidity_context.py rfm_impulse_candidates.py research tests
      - name: Run data quality and audit tests
        run: python -m unittest discover -s tests -v
      - name: Check browser JavaScript syntax
        run: |
          python -c 'from pathlib import Path; import re; pages=["static/index.html","static/poc.html"]; [(Path("/tmp/"+Path(p).name+".js").write_text(re.search(r"<script>(.*?)</script>",Path(p).read_text(),re.S).group(1))) for p in pages]'
          node --check /tmp/index.html.js
          node --check /tmp/poc.html.js
