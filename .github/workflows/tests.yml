name: RFM Quant checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q app.py data_quality.py market_audit.py history.py universe.py execution.py structure.py fibonacci.py tests
      - name: Run data quality and audit tests
        run: python -m unittest discover -s tests -v
