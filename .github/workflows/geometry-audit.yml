name: Audit real Fibonacci swings and structural context
on:
  push:
    branches: [main]
    paths:
      - research/audit_geometry_snapshot.py
      - research/export_research.py
      - rfm_impulse_candidates.py
      - swing_geometry.py
      - swing_liquidity_context.py
      - structural_liquidity.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install -r requirements.txt "numpy>=2,<3" "pandas>=2,<3" "xgboost>=3,<4" "scikit-learn>=1.5,<2"
      - name: Re-fetch exact fixed UTC window and verify archived OHLCV fingerprint
        run: python -m research.audit_geometry_snapshot --source pinned-api
      - name: Upload reproducible audit and re-run outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rfm-quant-swing-geometry-audit
          path: research_outputs/geometry_audit/
          retention-days: 30
          if-no-files-found: warn
