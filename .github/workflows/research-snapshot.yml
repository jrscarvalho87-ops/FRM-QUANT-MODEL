name: Experimental public OHLCV research snapshot
on:
  push:
    branches: [main]
    paths:
      - research/run_public_sample.py
  workflow_dispatch:
jobs:
  historical:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research runtime
        run: python -m pip install -r requirements.txt "numpy>=2,<3" "pandas>=2,<3" "xgboost>=3,<4" "scikit-learn>=1.5,<2"
      - name: Fetch confirmed public candles and run experimental backtests
        run: python -m research.run_public_sample
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rfm-quant-experimental-public-snapshot
          path: research_outputs/public_sample/
          if-no-files-found: warn
          retention-days: 30
